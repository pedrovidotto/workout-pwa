<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
  <title>WORKOUT.SYS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json">
  
  <meta name="theme-color" content="#0a0908">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WORKOUT">
</head>
<body data-theme="dark">

<header id="main-header">
  <div class="container">
    <div class="header-top">
      <h1 class="logo-text">WORKOUT.SYS</h1>
      <button id="theme-toggle-btn" class="theme-toggle" aria-label="Toggle Theme">
        <svg viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="9" class="svg-bg-circle"/>
          <path d="M10 1a9 9 0 0 1 0 18V1z" class="svg-fg-circle"/>
        </svg>
      </button>
    </div>
    <nav id="day-selector" role="tablist"></nav>
  </div>
</header>

<main class="container">
  <div id="workout-header">
    <h2 id="workout-title" class="page-title"></h2>
  </div>

  <div id="progress-bar-wrap" class="hidden">
    <div id="progress-bar-fill"></div>
  </div>
  <p id="progress-label" class="progress-label hidden"></p>

  <ul id="exercise-list" class="list-reset"></ul>

  <div id="completed-section" class="hidden">
    <h3 class="section-label">// COMPLETED</h3>
    <ul id="completed-list" class="list-reset"></ul>
  </div>

  <footer>
    <button id="reset-button" class="btn-secondary">Purge weekly progress</button>
  </footer>
</main>

<div id="timer-display">00:00</div>

<div id="reset-modal-overlay" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <h2 class="modal-title">Reset Cycle?</h2>
    <p class="modal-body-text">This will permanently delete all logs for the current week.</p>
    <div class="modal-actions">
      <button id="confirm-reset-btn" class="btn-primary">Confirm</button>
      <button id="cancel-reset-btn" class="btn-secondary" style="margin-top:8px;">Cancel</button>
    </div>
  </div>
</div>

<div id="completion-overlay">
  <div class="completion-card">
    <h2 class="modal-title" id="completion-title">Session Complete</h2>
    <p id="completion-message"></p>
    <p class="hint">Tap to dismiss</p>
  </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
